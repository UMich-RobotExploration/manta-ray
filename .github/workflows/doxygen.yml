name: Generate Doxygen Docs

on:
  push:
    branches:
      - main  # or master
  pull_request:
    branches:
      - main  # or master

jobs:
  generate_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the workflow to push to the repo, including gh-pages


    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Doxygen (using the prebuilt Docker image equivalent)
      - name: Set up Doxygen
        run: sudo apt-get install doxygen

      # Set up GraphViz
      - name: Set up Graphviz
        run: sudo apt-get install graphviz

      # Make your script executable
      - name: Make create_docs.sh executable
        run: chmod +x mantaray/create_docs.sh

      # Run Doxygen to generate docs (in the 'mantaray' directory)
      - name: Generate Docs with Doxygen
        run: |
          cd mantaray
          ./create_docs.sh

      # Deploy to GitHub Pages: flatten Doxygen's html/ into docs/ so the
      # Pages entry point stays at docs/index.html. rsync -a copies contents
      # and leaves untouched entries alone, preserving tracked assets already
      # in docs/ (e.g., docs/figures/ paper images referenced from README.md).
      - name: Deploy Doxygen Docs to GitHub Pages
        run: |
          rsync -a mantaray/docs/html/ docs/
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add docs
          git commit -m "Update Doxygen docs"
          git push --force "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
